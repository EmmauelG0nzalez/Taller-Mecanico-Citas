<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar Cita</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f5f5;
}

header{
    background:#1f2937;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:80%;
    margin:auto;
    margin-top:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<header>
<h1>Taller Mecánico - Agendar Cita</h1>
</header>

<div class="container">

<div class="card">

<h2>Registrar Cita</h2>

<form>

<input type="text" placeholder="Nombre del Cliente">

<input type="tel" placeholder="Teléfono">

<input type="text" placeholder="Vehículo">

<select>
<option>Seleccionar Servicio</option>
<option>Cambio de Aceite</option>
<option>Alineación</option>
<option>Balanceo</option>
<option>Afinación</option>
<option>Diagnóstico General</option>
</select>

<input type="date">

<input type="time">

<button type="submit">
Agendar Cita
</button>

</form>

</div>

</div>

</body>
</html>
