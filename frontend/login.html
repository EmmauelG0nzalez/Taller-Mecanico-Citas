<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Taller Mecánico</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

a{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="container">

<h1>Iniciar Sesión</h1>

<form action="../backend/login.php" method="POST">

    <input type="email" name="correo" placeholder="Correo" required>

    <input type="password" name="password" placeholder="Contraseña" required>

    <button type="submit">Ingresar</button>

</form>

<a href="registro.html">Crear Cuenta</a>



</div>

</body>
</html>
